[project]
name = "archon-jax"
version = "0.1.0"
description = "ARCHON NNUE training pipeline in JAX (D47c-parity prototype)"
requires-python = ">=3.11"
dependencies = [
    # PINNED 2026-07-22 (§8 ops gate): the floor pins silently resolved to
    # these exact versions during the study; parity proofs ran on them.
    # Bump deliberately, rerun quant_byte_parity + forward_parity after.
    "numpy==2.5.1",
    "jax==0.11.0",
    "optax==0.2.8",
]

[project.optional-dependencies]
# The legal-move policy mask needs movegen; python-chess is the prototype
# implementation (PyO3 bindings to the engine's movegen are the production
# design -- see docs/research/jax-pipeline-study.md).
policy = ["chess>=1.10"]
notebook = ["jupyter", "matplotlib"]

[tool.uv]
# ALL work is CPU-only; the live GPU belongs to the bullet trainer.
# Every entry point must run under:
#   JAX_PLATFORMS=cpu XLA_PYTHON_CLIENT_PREALLOCATE=false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archon_jax"]
