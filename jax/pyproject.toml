[project]
name = "archon-jax"
version = "0.1.0"
description = "ARCHON NNUE training pipeline in JAX (D47c-parity prototype)"
requires-python = ">=3.11"
dependencies = [
    # PINNED 2026-07-22 (§8 ops gate): the floor pins silently resolved to
    # these exact versions during the study; parity proofs ran on them.
    # Bump deliberately, rerun quant_byte_parity + forward_parity after.
    "numpy==2.5.1",
    "jax==0.11.0",
    "optax==0.2.8",
]

[project.optional-dependencies]
# The legal-move policy mask needs movegen; python-chess is the prototype
# implementation (PyO3 bindings to the engine's movegen are the production
# design -- see docs/research/jax-pipeline-study.md).
policy = ["chess>=1.10"]
notebook = ["jupyter", "matplotlib"]

[tool.uv]
# CPU-only by default (JAX_PLATFORMS=cpu XLA_PYTHON_CLIENT_PREALLOCATE=false);
# GPU sessions opt in with ARCHON_JAX_ALLOW_GPU=1 + jax[cuda12] and use the
# ft_kernel.py Pallas path (ARCHON_JAX_FT_IMPL=pallas) — the jnp.take
# reference path OOMs/crawls on GPU. Bench: tools/gpu_step_bench.py;
# measurements: docs/research/jax-gpu-kernel-2026-07-23.md.

[tool.pytest.ini_options]
markers = [
    "slow: builds real params + runs optimizer steps (seconds, not ms)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archon_jax"]
