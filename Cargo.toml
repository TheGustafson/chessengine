noshape62 = []
# `shape62d`/`shape62e` are RECTANGULAR: `foldcount::THR_LENS` (added here,
# uncapped where `THR_PAIR` saturates at 7) shows the residual tail is almost
# entirely LONG SUB lists -- adds <= 6 covers 98.64% of folds and never exceeds
# 12, while subs run to 16 and only reach 92.99% at 6. So these add the
# subs = 7 and subs = 8 COLUMNS for every add count already covered, not another
# square ring. Split in two because they are also the study's mechanism probe:
# `subs = 7` leaves 3 rows in LLVM's ×4 unroll remainder and `subs = 8` leaves
# none, so the win per fold should track `len mod 4` rather than `len`.
#
# NOT LANDED. Both are real instruction wins (-3.91 and -5.37 i/n) and both fail
# study 62's pre-registered `.text` rule (>= 2.0 i/node per KB, they are 0.60 and
# 0.75); see that study's §4. The split also refuted the `len mod 4` mechanism
# that predicted `subs = 7` would dominate `subs = 8`.
shape62d = []
shape62e = ["shape62d"]
