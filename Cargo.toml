[package]
name = "chessengine"
version = "0.1.0"
# Feeds the UCI `id author` line via CARGO_PKG_AUTHORS (design/12 §3.3).
authors = ["TheGustafson"]
edition = "2024"

[dependencies]

[[bin]]
name = "obs-tool"
path = "src/bin/obs_tool.rs"
required-features = ["datagen"]

[[bin]]
name = "root-analysis"
path = "src/bin/root_analysis.rs"
required-features = ["datagen"]

[features]
# SPSA tuning (D45): every params.rs scalar becomes a runtime-settable atomic
# behind `setoption name <NAME> value <x>`. OFF by default: the default build
# expands the same entries to inline-folded constants and stays bench-
# identical (D24). Tune builds are for the SPSA harness only, never shipped.
tune = []
# D47V deploy arch (768 accumulator, 32/32 head + skip). Mutually exclusive
# with the default 1280/128/32 consts; build D47V-capable binaries with
# `--features sota,arch-d47v`. Never combined into one binary — the CENN's
# dims must match the build (the loader validates section sizes).
arch-d47v = []
# D48W gen-2 arch (1536 accumulator, 16/32 head + skip). Same exclusivity
# rule: `--features sota,arch-d48w`, never combined with arch-d47v.
arch-d48w = []
# D48X: the W recipe at the A3 trunk's OWN width (1280 accumulator, 16/32 head
# + skip) — the arch the pre-launch NPS gate selected over 1536 (2026-07-27).
# Same exclusivity rule as the others.
arch-d48x = []
# Distribution-only: embed net-0 as the default eval so the engine plays NNUE
# with no `EvalFile` set (for GUIs that can't set UCI string options). OFF by
# default, so runtime [dependencies] stays empty (D15) and the default build is
# PSQT/bench-neutral. Build a playable binary with `--features embed-net` plus
# ARCHON_EMBED_NET=<.cenn path relative to the crate root> in the build env;
# the net's width must match the build's nnue-l1-* feature.
embed-net = []
# Widen the NNUE hidden layer 256 -> 512 (arch-scale experiment, task #19). OFF
# by default so the shipped engine + depth-6 bench stay 768x256 and bench-neutral.
# A 512-build loads ONLY 512-wide CENN nets (the loader checks the header `l1`);
# build a 512 engine with `--features nnue-l1-512`.
nnue-l1-512 = []
# Experimental classic width control. Mutually exclusive with nnue-l1-512;
# compile-time assertions in nnue::mod reject accidental combinations.
nnue-l1-1024 = []
# Next capacity rungs for the UHO scaling ladder (2026-07-16); same rules.
nnue-l1-2048 = []
nnue-l1-4096 = []
# Experimental learned policy head for MovePicker quiet ordering (design/17
# Thrust II, src/policy.rs). OFF by default so the shipped engine + depth-6 bench
# stay byte-identical; build the experiment with `--features policy`.
policy = ["sota"]
# The Observation Store (design/16 §3.5, D29/D43): the permanent four-layer
# search-observation record + shard writer/reader, std-only TLV. OFF by
# default so the tournament/bench binary compiles it out (§6 bench
# neutrality); build datagen tooling with `--features datagen`.
datagen = []
# D41 learned search-consequence head contracts and experiments. OFF by
# default; the initial scaffold is shadow-only and has no search authority.
search-control = []
# The SOTA NNUE net (D40, design/11 §12): SF features + Reckless-shaped hybrid
# head. OFF by default (the whole SOTA path is inert until it ships), so the
# default build + depth-6 bench stay byte-identical. Build with `--features sota`.
sota = []

[dev-dependencies]
# Test/bench-only (D15: runtime [dependencies] stays empty; dev-deps allowed).
# Criterion micro-benches are never a merge gate (design/14 §3.3); baselines
# live in docs/perf-baseline.md.
criterion = "0.8.2"
proptest = "1"

# Criterion needs the default libtest bench harness disabled (design/14 §3.3).
[[bench]]
name = "attacks"
harness = false

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "perft"
harness = false

# Build profiles (D16; design/01 §3.7, design/14 §3.7). The documented fast
# configuration adds RUSTFLAGS="-C target-cpu=x86-64-v3" (see CLAUDE.md) —
# deliberately NOT hardcoded here so default builds stay portable.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort" # ignored by test/bench profiles, so cargo test still works

# Profiling builds: release codegen + symbols. `perf` / flamegraphs read this.
[profile.profiling]
inherits = "release"
debug = "line-tables-only" # symbols for perf/flamegraph; no codegen change
