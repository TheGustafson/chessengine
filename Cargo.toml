[package]
name = "chessengine"
version = "0.1.0"
# Feeds the UCI `id author` line via CARGO_PKG_AUTHORS (design/12 §3.3).
authors = ["TheGustafson"]
edition = "2024"

[dependencies]

[[bin]]
name = "obs-tool"
path = "src/bin/obs_tool.rs"
required-features = ["datagen"]

[[bin]]
name = "root-analysis"
path = "src/bin/root_analysis.rs"
required-features = ["datagen"]

[features]
# SPSA tuning (D45): every params.rs scalar becomes a runtime-settable atomic
# behind `setoption name <NAME> value <x>`. OFF by default: the default build
# expands the same entries to inline-folded constants and stays bench-
# identical (D24). Tune builds are for the SPSA harness only, never shipped.
tune = []
# D47V deploy arch (768 accumulator, 32/32 head + skip). Mutually exclusive
# with the default 1280/128/32 consts; build D47V-capable binaries with
# `--features sota,arch-d47v`. Never combined into one binary — the CENN's
# dims must match the build (the loader validates section sizes).
arch-d47v = []
# D48W gen-2 arch (1536 accumulator, 16/32 head + skip). Same exclusivity
# rule: `--features sota,arch-d48w`, never combined with arch-d47v.
arch-d48w = []
# D48X: the W recipe at the A3 trunk's OWN width (1280 accumulator, 16/32 head
# + skip) — the arch the pre-launch NPS gate selected over 1536 (2026-07-27).
# Same exclusivity rule as the others.
arch-d48x = []
# HalfKA-only PROBE (arch-hka2048) — NOT a pinned decision, an unratified
# experiment. No FullThreats channel, 2048 accumulator, 32/32 head.
# The threat channel costs 1.78x engine speed at 1280 and 1.40x at 768
# (measured 2026-07-27), and removing it makes width 5.7x cheaper per unit —
# which is why this arch is WIDER than anything we have shipped. The net
# itself carries the no-threats flag, so the engine needs no runtime switch;
# this feature only sets the dimensions. Same exclusivity rule.
arch-hka2048 = []
# Distribution-only: embed net-0 as the default eval so the engine plays NNUE
# with no `EvalFile` set (for GUIs that can't set UCI string options). OFF by
# default, so runtime [dependencies] stays empty (D15) and the default build is
# PSQT/bench-neutral. Build a playable binary with `--features embed-net` plus
# ARCHON_EMBED_NET=<.cenn path relative to the crate root> in the build env;
# the net's width must match the build's nnue-l1-* feature.
embed-net = []
# Widen the NNUE hidden layer 256 -> 512 (arch-scale experiment, task #19). OFF
# by default so the shipped engine + depth-6 bench stay 768x256 and bench-neutral.
# A 512-build loads ONLY 512-wide CENN nets (the loader checks the header `l1`);
# build a 512 engine with `--features nnue-l1-512`.
nnue-l1-512 = []
# Experimental classic width control. Mutually exclusive with nnue-l1-512;
# compile-time assertions in nnue::mod reject accidental combinations.
nnue-l1-1024 = []
# Next capacity rungs for the UHO scaling ladder (2026-07-16); same rules.
nnue-l1-2048 = []
nnue-l1-4096 = []
# Experimental learned policy head for MovePicker quiet ordering (design/17
# Thrust II, src/policy.rs). OFF by default so the shipped engine + depth-6 bench
# stay byte-identical; build the experiment with `--features policy`.
policy = ["sota"]
# The Observation Store (design/16 §3.5, D29/D43): the permanent four-layer
# search-observation record + shard writer/reader, std-only TLV. OFF by
# default so the tournament/bench binary compiles it out (§6 bench
# neutrality); build datagen tooling with `--features datagen`.
datagen = []
# D41 learned search-consequence head contracts and experiments. OFF by
# default; the initial scaffold is shadow-only and has no search authority.
search-control = []
# The SOTA NNUE net (D40, design/11 §12): SF features + Reckless-shaped hybrid
# head. OFF by default (the whole SOTA path is inert until it ships), so the
# default build + depth-6 bench stay byte-identical. Build with `--features sota`.
sota = []
# Perf study 29's exact accumulator LOAD CENSUS. Adds one relaxed atomic pair
# per accumulator-kernel call and dumps the totals on stderr at the end of
# `bench`. Instrumentation only: the search tree, node count and eval hash are
# untouched (verified), but the binary is NOT a timing reference. Never shipped.
foldcount = ["sota"]
# Perf study 34's MOVE-ORDERING CENSUS. Study 23 measured how much work
# `init_quiets` does; this measures how much of it the search ever USES —
# per picker, how far into the scored-and-sorted quiet list the move loop
# actually walked, plus the cutoff-move-index distribution. Relaxed atomics on
# paths that make no search decision, so the tree stays bit-identical
# (verified by `tools/perf34/ident34.sh`); the binary is NOT a timing
# reference. Never shipped.
census34 = []
# Perf study 34's NULL ARM: builds the study's `GoodQuiet`/`BadQuiet` split
# with the split DISABLED, so the binary carries the arm's struct layout,
# fields and loop shape while doing the pre-study amount of scanning. Its
# purpose is to price the instrument on the same machinery the arm moves.
# Measurement only, never shipped.
null34 = []
# Perf study 34 arm 2: `partial_insertion_sort`'s BRANCHLESS fixed-width
# insertion window. **DECIDED BY PERF STUDY 40 -- IT LOSES, AND IT STAYS OFF.**
# The mechanism is real (-4.409% of all engine branch mispredicts, 60/60 paired
# rounds) and it was priced on `ex_no_retire.empty` rather than `cycles:u`:
# it buys 9.93 cycles/node of front-end bubble and pays 17.40 cycles for the
# +42.58 instructions, i.e. +0.19% of cycles, about -0.3 Elo. The exchange rate
# that decides it -- 9.13 cycles per mispredict on this engine, not the ~18
# study 34 assumed -- is in `src/movepick.rs`. Do not re-open blind.
insertwin34 = []
# Perf study 29's TRAFFIC-PINNING probes. Both keep the load COUNT of every
# accumulator kernel bit-for-bit identical and collapse ONE stream's working
# set to a single hot line, so the drop in L1 misses / load-stall cycles is
# that stream's share and nothing else. They compute WRONG evaluations on
# purpose — measurement builds only, never shipped, never gated.
#   accpin: the accumulator stream (fold `src`, `activate`'s four arrays)
#           reads from one static buffer instead of the per-ply stack.
#   wpin:   every fold folds weight row 0, whatever the feature index says.
probe-accpin = ["sota"]
probe-wpin = ["sota"]
# `probe-accpin` pins only the READ half of accumulator streaming; the folds
# still WRITE 2560 B per call into the real per-ply stack, so that stack keeps
# its full footprint and keeps evicting weight rows. Perf study 31 priced the
# same quantity with an ADDITIVE read+write probe and got a very different
# answer, so this pins the write half too and settles which half (if either)
# costs anything. Implies `probe-accpin`: pinning writes without pinning reads
# would measure a third thing.
probe-dstpin = ["probe-accpin"]
# Perf study 39's two arms for the additive/subtractive disagreement that
# studies 29 (§4.1) and 31 (§2.4) both deferred: 0.45 vs 2.36 stall cycles per
# 64-byte accumulator line, a 5.2x gap that is the whole width of fusion's
# bracket.
#   actpin:  pins ONLY `activate`'s four accumulator reads -- 68.9 lines/node,
#            the EXACT magnitude of study 31's additive copy, measured in the
#            SUBTRACTIVE direction. `accpin` pins the fold `src` stream too and
#            so cannot be compared to study 31 dose-for-dose.
#   addcopy: study 31's additive redundant copy, rebuilt with runtime knobs
#            (`P39_DOSE`, `P39_RING`) so one binary gives the dose response AND
#            the L1-resident control that separates the probe's ISSUE cost from
#            its LOCALITY cost. See `sota_simd::probe::addcopy`.
probe-actpin = ["sota"]
probe-addcopy = ["sota"]
# Perf study 38's NULL ARM for the threat-fold parent alias: builds the alias
# array, its reads and its stores, but never TAKES the alias, so every pure-copy
# fold still runs its 2560-byte copy. Measurement only, never shipped.
#
# ⚠ IT DOES NOT PRICE "THE MACHINERY" ON ITS OWN, and study 38 read it that way.
# Differencing it against a no-machinery build changes TWO things: the machinery
# AND the copy's codegen, because carrying the array is what makes LLVM stop
# calling `memcpy` at that site. Study 40 unconfounded it with `noalias40` +
# `callcopy40`: the machinery is **+4.35 i/n**, the codegen flip **+13.98**, and
# study 38's "+19.7 of machinery" was their sum.
null38 = ["sota"]
# Perf study 40's two overlays for the ~26 i/n study 38 could not localise.
# `null38` above prices "the machinery" only if the two binaries it differences
# compile the COPY the same way -- and they do not: the pre-study-38 binary
# emitted a `memcpy` CALL where every binary carrying the alias array emits 40
# inline zmm moves (`tools/perf40/symscan40.py`, study 40 SS2). So the machinery
# and the codegen flip are confounded in that number, and these two features
# unconfound it on the exact `instructions:u` counter:
#   noalias40:  the alias table becomes a ZERO-SIZED stand-in whose `get(k)` is
#               `k` -- the pre-study-38 source, reconstructed in place instead
#               of checked out of git onto a different tree.
#   callcopy40: PINS the pure-copy fold to the library call (an opaque length
#               defeats LLVM's inline expansion), so the machinery can be
#               measured with the copy's codegen held fixed.
# Measurement only, never shipped, never gated.
noalias40 = ["sota"]
callcopy40 = ["sota"]
# (`outcopy40` is gone: it LANDED. The pure-copy fold's 2560-byte copy now
# always goes through the `#[inline(never)]` `copy_acc_outlined` helper --
# -16.01 instructions and -1.21 branches per node, node-identical. See that
# function's doc comment.)
# Perf study 40's DOSE AMPLIFIER for `partial_insertion_sort` (`src/dose40.rs`).
# `insertwin34` is a ~0.2%-of-cycles trade and six nulls put the `cycles:u`
# floor on this box an order of magnitude above that, so the arm is replayed
# `P40_DOSE` extra times per call over REAL earlier inputs held in a ring: the
# same trade at (D+1)x its size, regressed back to one call by a dose series.
# The search tree is untouched at every dose (node count + eval hash gated).
# Measurement only, never shipped.
dosesort40 = []
# Perf study 43's SOFTWARE-PREFETCH arm for the Finny warm refresh, selected by
# `P43_PF` at run time so control and arm are the SAME BYTES (study 29 built its
# prefetch arm as a separate binary, and its own §5.3 records a byte-different
# null moving the cycles median further than the arm). Six modes -- see
# `sota_accumulator::pf43`. Measurement only unless a mode wins, in which case
# the winning mode lands unconditionally and the feature goes away.
pf43 = ["sota"]

[dev-dependencies]
# Test/bench-only (D15: runtime [dependencies] stays empty; dev-deps allowed).
# Criterion micro-benches are never a merge gate (design/14 §3.3); baselines
# live in docs/perf-baseline.md.
criterion = "0.8.2"
proptest = "1"

# Criterion needs the default libtest bench harness disabled (design/14 §3.3).
[[bench]]
name = "attacks"
harness = false

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "perft"
harness = false

# Build profiles (D16; design/01 §3.7, design/14 §3.7). The documented fast
# configuration adds RUSTFLAGS="-C target-cpu=x86-64-v3" (see CLAUDE.md) —
# deliberately NOT hardcoded here so default builds stay portable.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort" # ignored by test/bench profiles, so cargo test still works

# Profiling builds: release codegen + symbols. `perf` / flamegraphs read this.
[profile.profiling]
inherits = "release"
debug = "line-tables-only" # symbols for perf/flamegraph; no codegen change
