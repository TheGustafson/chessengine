noshape61 = ["noshape62"]
# ---- Perf study 62 -- the rest of the square grid, as a measured LADDER.
#
# Study 61 left 31.60% of threat folds on the runtime-length generic kernel and
# named two routes: continue the table, or fix the generic kernel's loop
# control. Its own pair histogram, re-run here, says the tail is LONG -- 7.55%
# of folds carry >= 7 rows on one side -- so no finite square grid closes it and
# each rung has to pay for its `.text`. Cumulative coverage of threat FOLDS
# (and the share of all threat ROWS left generic, which is what the control is
# charged per):
#
#   grid 0..=3 (study 61, 15 arms)  68.40% of folds   59.66% of rows generic
#   ring a     (+9 arms)            79.42%            44.31%   -19.90 i/n
#   ring b     (+11 arms)           87.04%            30.84%   -19.01
#   ring c     (+13 arms)           92.45%            19.31%   -22.90
#
# LANDED UNCONDITIONALLY: all three rings on the threat fold (grid 0..=6,
# -61.80 i/n for +23,648 B) and the grid 0..=4 dispatch on the Finny warm
# refresh, which had NO dispatch at all (79.95% of calls, -42.54 i/n for
# +13,296 B) -- plus a further -8.64 i/n that appeared on promotion, because the
# 33 threat arms in ONE `match` beat the same arms in three chained ones.
