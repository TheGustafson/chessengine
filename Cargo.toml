# construction (a hint computes no value the score depends on) and gated on
# the `Bench:` fingerprint like every other study arm.
histpf44 = []
# ---- perf study 67: THE INSTRUCTION-CACHE ARM.
#
# `search::<NonPv>` is 45,565 bytes against a 32 KB L1i and carries **34.06 %
# of the engine's L1i line fills** (`ic_cache_fill_l2`, per-symbol). The engine
# takes 128.0 L1i fills per node and spends **445.7 cycles/node with a
# completely empty op queue** (`de_op_queue_empty`, startup subtracted) — 11.5 %
# of the frame, a pool no previous study in this series had an instrument for.
#
# `icold67` marks the callees PGO folds into the search body that carry the
# worst BYTES-PER-OP ratio (perf study 67 §3's inline-callee byte census):
# `tt_verify_child` (3,520 B / 0.1 % of the symbol's ops), `evaluate`
# (2,605 B / 1.9 %), `update_all_stats` (2,894 B / 4.0 %), `check_time_slow`
# (495 B / 0.2 %), `new_probcut`, `make_null_move`/`unmake_null_move`,
# `is_shuffling` (237 B / 0.0 %).
#
# It deliberately INVERTS study 55's `#[inline(always)]` ruling on two of them.
# That ruling was made on `instructions:u`, which is blind to code size
# (study 57's dispatch table: −113 i/n while L1i misses rose 6.2 %).
# Node-identical by construction — inlining decisions cannot move the tree.
#
# **MEASURED, AND IT LOSES. Default OFF; do not turn it on.** It shrinks
# `search::<NonPv>` 45,565 → 36,033 B (−20.9 %) and `.text` −1.9 %, and over
# 14 shuffled rounds against `s67-qt` it reads **instructions +0.385 % (0/14),
# `ic_cache_fill_l2` +3.203 % (3/14), `de_op_queue_empty` +1.298 %, task-clock
# +1.078 %** — against a byte-identical-binary null of +0.467 % (6/14) on the
# fill counter. The bytes it removes were never FETCHED (a line with zero
# sampled ops never enters L1i), and two of the eight are warm enough that
# outlining them adds a fetch stream. **Function size is not the L1i cost; the
# number of distinct lines the frame EXECUTES is.**
icold67 = []
# `icold67b` — the DEDUPLICATION arm, a different mechanism from `icold67`'s.
# `icold67` moved code that the frame barely executes; this one moves code the
# frame executes a lot of, in SEVERAL COPIES. Study 67's duplication census
# (`tools/perf67/dupcensus67.py`) over the four search monomorphisations:
# `do_move` 16,638 B in 3 copies, `next_move` 10,871 B in 4. Both are hot in at
# least two of them, so one out-of-line copy lets both callers fetch the same
# lines. Node-identical by construction.
icold67b = []
# Perf study 44's FOLD-TILE WIDTH sweep. `REGS` (the number of live zmm
# accumulators in every fold kernel's tile) is 20 at ACC 1280, chosen as the
# largest exact divisor of ACC_BLOCKS and adjudicated on `instructions:u` --
# a counter that can only ever prefer the widest tile, since narrower means
# more loop control. These caps force 10 / 8 / 5 / 4 instead. The motivating
# measurement is study 44's census: store-queue-full is the engine's largest
# dispatch blocker at 502.6 cycles/node, and a 20-register tile closes with a
# 40-store burst. Bit-identical at every setting (same blocks, same order,
# same arithmetic), so all of them are gated on the `Bench:` fingerprint.
# `regs20_44` restores the PRE-STUDY-44 tile (REGS = 20) -- it is the
# subtractive arm that re-prices the landed change at any later date, and the
# label that reproduces every pre-44 measurement of these kernels.
regs20_44 = []
regs10_44 = []
regs8_44 = []
regs4_44 = []
# Perf study 60 arm `hskip`: hoist the D47V output-skip lane's dot product from
# the END of `forward_into` (after `propagate_l3`) to immediately after
# `activate_ft`. Same loads, same arithmetic, same f32 add at the same place --
# only the ISSUE POINT of a 1280-byte read that study 51 measured at a 96.27%
# L1 miss rate moves, from the tail of a strictly serial matmul chain to a spot
# where the whole matmul can overlap it. Memory-level parallelism, not a
# prefetch: no hint instruction and no extra load. Bit-identical by
# construction, so it is gated on the eval hash like everything else here.
#
# *** MEASURED AND REFUTED (perf study 60 sec 4). DO NOT RE-PROPOSE. ***
# 40 paired rounds, byte-identical null in the rotation, node-identical at
# 5,001,562 and eval hash 2e1ede95...79c4:
#   instructions:u          -0.031%  (-1.75/node)   40/40   <- better
#   L1-dcache-loads:u       -0.219%  (null -0.048)  30/40   <- better
#   L1-dcache-load-misses:u +0.614%  (null +0.135)   3/40   <- WORSE, p<0.0001
# The arm's own mechanism inverts: issued EARLY the skip lane's 20 cold lines
# sit in L1 through the sparse L1 matmul and compete with `l1_weights` (which
# study 51 already measured at 91.44% miss); issued LATE they are fetched once,
# used once, and displace nothing. Hoisting a cold single-use read into a hot
# streaming phase adds the displaced data's misses to its own.
hskip60 = []
# Perf study 60 arm `htail`: `_MM_HINT_T0` on the head's TAIL tables
# (`l2_weights` 2048 B, `l2_biases`, `l3_weights`, `l1_biases` -- 2,304 B, 36
# lines) at the top of `forward_into`, ~800 instructions before their first
# use. The ninth software prefetch in this engine and the FIRST not aimed at
# the fold's weight rows: study 29 sec 5.2's ceiling argument (one hint converts
# 1 of a row's 22 demand misses; T2 lands in L2 where the rows already hit)
# does not apply to a 2 KB table that is read in full every evaluation and that
# study 51 measured at 98.84-100.00 % L1 miss. A hint cannot change a value, so
# this is gated on the eval hash like everything else.
#
# *** MEASURED AND REFUTED -- PREFETCH KILL #9 (perf study 60 sec 5). ***
# Same 40-round panel:
#   instructions:u          +0.404%  (+22.8/node)    0/40
#   L1-dcache-loads:u       +0.205%  (null -0.048)   6/40
#   L1-dcache-load-misses:u +0.379%  (null +0.135)   5/40   <- WORSE, p<0.0001
# It died at the one site where study 29 sec 5.2's ceiling argument did NOT
# apply, which is what makes it informative: the tail tables' 36 lines are one
# dense sequential burst whose misses ALREADY overlap each other, so there was
# no exposed latency to hide -- only 36 extra address computations and 36 extra
# L1 lookups. The rule that now covers all nine kills: a hint pays only where
# the miss is cold AND SERIALISING.
htail60 = []
# Perf study 40's DOSE AMPLIFIER for `partial_insertion_sort` (`src/dose40.rs`).
# `insertwin34` is a ~0.2%-of-cycles trade and six nulls put the `cycles:u`
# floor on this box an order of magnitude above that, so the arm is replayed
# `P40_DOSE` extra times per call over REAL earlier inputs held in a ring: the
# same trade at (D+1)x its size, regressed back to one call by a dose series.
# The search tree is untouched at every dose (node count + eval hash gated).
# Measurement only, never shipped.
dosesort40 = []
# Perf study 43's SOFTWARE-PREFETCH arm for the Finny warm refresh, selected by
# `P43_PF` at run time so control and arm are the SAME BYTES (study 29 built its
# prefetch arm as a separate binary, and its own §5.3 records a byte-different
# null moving the cycles median further than the arm). Six modes -- see
# `sota_accumulator::pf43`. Measurement only unless a mode wins, in which case
# the winning mode lands unconditionally and the feature goes away.
pf43 = ["sota"]
# Perf study 43 arm NT: the Finny cache entry (written now, next read ~350
# nodes later, in a stream that pushes ~3 MB through a 1 MB L2 in between) is
# stored NON-TEMPORALLY, while the stack destination the head reads within the
# same node stays a normal store. Zero instruction-count change -- same store
# count, different opcode -- so it is a pure cache-policy arm. Measurement
# feature; if it wins it lands unconditionally and the feature goes away.
nt43 = ["sota"]

[dev-dependencies]
# Test/bench-only (D15: runtime [dependencies] stays empty; dev-deps allowed).
# Criterion micro-benches are never a merge gate (design/14 §3.3); baselines
# live in docs/perf-baseline.md.
criterion = "0.8.2"
proptest = "1"

# Criterion needs the default libtest bench harness disabled (design/14 §3.3).
[[bench]]
name = "attacks"
harness = false

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "perft"
harness = false

# Build profiles (D16; design/01 §3.7, design/14 §3.7). The documented fast
# configuration adds RUSTFLAGS="-C target-cpu=x86-64-v3" (see CLAUDE.md) —
# deliberately NOT hardcoded here so default builds stay portable.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort" # ignored by test/bench profiles, so cargo test still works

# Profiling builds: release codegen + symbols. `perf` / flamegraphs read this.
[profile.profiling]
inherits = "release"
debug = "line-tables-only" # symbols for perf/flamegraph; no codegen change
