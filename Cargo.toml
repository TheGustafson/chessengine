# by default so the shipped engine + depth-6 bench stay 768x256 and bench-neutral.
# A 512-build loads ONLY 512-wide CENN nets (the loader checks the header `l1`);
# build a 512 engine with `--features nnue-l1-512`.
nnue-l1-512 = []
# Experimental classic width control. Mutually exclusive with nnue-l1-512;
# compile-time assertions in nnue::mod reject accidental combinations.
nnue-l1-1024 = []
# Next capacity rungs for the UHO scaling ladder (2026-07-16); same rules.
nnue-l1-2048 = []
nnue-l1-4096 = []
# Experimental learned policy head for MovePicker quiet ordering (design/17
# Thrust II, src/policy.rs). OFF by default so the shipped engine + depth-6 bench
# stay byte-identical; build the experiment with `--features policy`.
policy = ["sota"]
# The Observation Store (design/16 §3.5, D29/D43): the permanent four-layer
# search-observation record + shard writer/reader, std-only TLV. OFF by
# default so the tournament/bench binary compiles it out (§6 bench
# neutrality); build datagen tooling with `--features datagen`.
datagen = []
# D41 learned search-consequence head contracts and experiments. OFF by
# default; the initial scaffold is shadow-only and has no search authority.
search-control = []
# Perf study 68: the `ARCHON_SEARCH_STATS` / SSTATS search-anatomy report.
# OFF by default, and OFF means the eleven counters do not EXIST -- `SearchStats`
# is a zero-sized type and every bump method an empty body, so the shipped build
# carries no store on any of the fifteen per-node/per-move sites that used to
# feed them. `cfg(test)` implies it, because two NMP unit tests read `nmp_try`.
#
# It was a runtime `if std::env::var_os(...)` before, which is exactly why this
# cost shipped: an empty *body* deletes a store only if there is no place to
# store, and a `&mut Worker` field live across the recursive search call is a
# place. Measured numbers: docs/research/perf-study-68-layout-2026-08-01.md.
search-stats = []
# Perf study 68's LAYOUT NULL. One cold, never-called function whose only job is
# to shift `.text` and re-roll every downstream symbol's L1i set mapping while
# changing nothing the search executes. It exists to measure how much of an
# arm's `ic_cache_fill_l2` delta is the arm and how much is the lottery.
# Default OFF and it must never ship. See src/lib.rs and
# docs/research/perf-study-68-layout-2026-08-01.md §2.6.
pad68 = []
# Perf study 69's PGO NULL. Eight inert bytes on `Board`, in the exact place
# study 69's arm 1 put its `&'static AttackTables`: it moves every later field
# offset (so instruction encodings, so function sizes, so LLVM's inline cost
# model) and changes nothing the search computes. `pad68` cannot do this job --
# a never-called function emits no profile counters, so PGO decides identically.
# Default OFF and it must never ship. See src/board.rs and
# docs/research/perf-study-69-branches-and-the-guard-2026-08-01.md §2.7.
pgonull69 = []
# The SOTA NNUE net (D40, design/11 §12): SF features + Reckless-shaped hybrid
# head. OFF by default (the whole SOTA path is inert until it ships), so the
# default build + depth-6 bench stay byte-identical. Build with `--features sota`.
sota = []
# Perf study 29's exact accumulator LOAD CENSUS. Adds one relaxed atomic pair
# per accumulator-kernel call and dumps the totals on stderr at the end of
# `bench`. Instrumentation only: the search tree, node count and eval hash are
# untouched (verified), but the binary is NOT a timing reference. Never shipped.
# ---- perf study 65 -- the NARROW WEIGHT ROW. The single largest BIT-EXACT
# route left in the engine, and the only byte-cut compatible with the owner
# ruling that `L1 = 1280` stays (it cuts bytes per LANE, not lanes per row).
#
# 53.06% of the FullThreats rows this engine folds have a peak magnitude <= 31,
# i.e. they fit six signed bits losslessly. Such a row is stored packed --
# 960 B = exactly 15 cache lines against 20 -- inside its OWN unshrunk
# 1280-byte slot, so `feature * ACC` offset arithmetic, every producer and
# every non-kernel consumer are untouched and the route costs none of the
# 243 KB permutation table study 64 SS6.1 priced it with. The fold kernel
# decodes with vpermb + vpmultishiftqb + vpternlogd + vpmovzxbw: four ops per
# 32 lanes against one, for 3.4 GB less traffic over the study frame (7.40% of
# all weight-row bytes; study 64 SS2.1 measured weight rows at 55.25% of the
# engine's L1-miss latency).
#
# Dispatch is per ROW, not per fold, and study 65 measured why: only 9.99% of
# folded rows live in a fold whose EVERY row is narrow, so a whole-fold "all
# narrow?" predicate converts 5.3x less. HalfKA is excluded because 97.30% of
# its folded rows need the full eight bits.
#
# Bit-exact by construction (a narrower store of the same values) and gated as
# such: eval hash and node total must both be unchanged.
#
# The packing needs AVX512_VBMI, which the compile-time direct dispatch does
# NOT imply (Cascade Lake has VNNI, no VBMI), so `narrow_supported()` decides
# once at LOAD time; when it is false the table is left 8-bit, the bitmap stays
# empty and every path is byte-for-byte the pre-study one.
narrow65 = ["sota"]
foldcount = ["sota"]
# perf study 51: the fold-weighted row probes (all-zero rows, per-row bit width).
# They walk every folded row's bytes, so they must be OFF in the binary the IBS
# region census measures -- hence a feature of their own, not part of foldcount.
rowprobe = ["foldcount"]
# perf study 51: 64 B of padding in ThreatEntry, breaking the exact 4 KB
# congruence between the two 1.3 MB accumulator stacks. Bit-identical.
cong51 = ["sota"]
# perf study 49 DIAGNOSTIC PROBE: inject a strictly serial cache-missing chase
# into `HalfkaContext::current_full`, in its own `#[inline(never)]` leaf, so a
# known quantity of stall has a known owner and the profiler's attribution of
# it can be MEASURED rather than assumed. Never shipped; `black_box`ed, so the
# node count is unchanged.
skidprobe = ["sota"]
# Perf study 34's MOVE-ORDERING CENSUS. Study 23 measured how much work
# `init_quiets` does; this measures how much of it the search ever USES —
# per picker, how far into the scored-and-sorted quiet list the move loop
# actually walked, plus the cutoff-move-index distribution. Relaxed atomics on
# paths that make no search decision, so the tree stays bit-identical
# (verified by `tools/perf34/ident34.sh`); the binary is NOT a timing
# reference. Never shipped.
census34 = []
# Perf study 70's move-ordering QUALITY census: the same beta-cutoff population
# study 34 counted, but split by NODE KIND (PV/NonPV/qsearch), REMAINING DEPTH,
# and the `MovePicker` STAGE that emitted the cutting move, plus the all-nodes
# study 34 never counted. Relaxed atomics on decision-free paths (tree stays
# bit-identical, `tools/perf70/ident70.sh`); never shipped.
census70 = []
# Perf study 70's move-ordering ARM BENCH: every candidate ordering change
# behind ONE runtime-configurable build (`ARCHON_A70=lva=8,...`). The study's
# metric is nodes-to-depth, a deterministic integer that cannot see the cost of
