[package]
name = "chessengine"
version = "0.1.0"
# Feeds the UCI `id author` line via CARGO_PKG_AUTHORS (design/12 §3.3).
authors = ["TheGustafson"]
edition = "2024"

[dependencies]

[features]
# Distribution-only: embed net-0 as the default eval so the engine plays NNUE
# with no `EvalFile` set (for GUIs that can't set UCI string options). OFF by
# default, so runtime [dependencies] stays empty (D15) and the default build is
# PSQT/bench-neutral (548978). Build a playable binary with `--features embed-net`.
embed-net = []
# Widen the NNUE hidden layer 256 -> 512 (arch-scale experiment, task #19). OFF
# by default so the shipped engine + depth-6 bench stay 768x256 and bench-neutral.
# A 512-build loads ONLY 512-wide CENN nets (the loader checks the header `l1`);
# build a 512 engine with `--features nnue-l1-512`.
nnue-l1-512 = []
# Experimental learned policy head for MovePicker quiet ordering (design/17
# Thrust II, src/policy.rs). OFF by default so the shipped engine + depth-6 bench
# stay byte-identical; build the experiment with `--features policy`.
policy = []
# The SOTA NNUE net (D40, design/11 §12): SF features + Reckless-shaped hybrid
# head. OFF by default (the whole SOTA path is inert until it ships), so the
# default build + depth-6 bench stay byte-identical. Build with `--features sota`.
sota = []

[dev-dependencies]
# Test/bench-only (D15: runtime [dependencies] stays empty; dev-deps allowed).
# Criterion micro-benches are never a merge gate (design/14 §3.3); baselines
# live in docs/perf-baseline.md.
criterion = "0.8.2"
proptest = "1"

# Criterion needs the default libtest bench harness disabled (design/14 §3.3).
[[bench]]
name = "attacks"
harness = false

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "perft"
harness = false

# Build profiles (D16; design/01 §3.7, design/14 §3.7). The documented fast
# configuration adds RUSTFLAGS="-C target-cpu=x86-64-v3" (see CLAUDE.md) —
# deliberately NOT hardcoded here so default builds stay portable.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort" # ignored by test/bench profiles, so cargo test still works

# Profiling builds: release codegen + symbols. `perf` / flamegraphs read this.
[profile.profiling]
inherits = "release"
debug = "line-tables-only" # symbols for perf/flamegraph; no codegen change
