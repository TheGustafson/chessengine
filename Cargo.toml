[package]
name = "chessengine"
version = "0.1.0"
# Feeds the UCI `id author` line via CARGO_PKG_AUTHORS (design/12 §3.3).
authors = ["TheGustafson"]
edition = "2024"

[dependencies]

[[bin]]
name = "obs-tool"
path = "src/bin/obs_tool.rs"
required-features = ["datagen"]

[[bin]]
name = "root-analysis"
path = "src/bin/root_analysis.rs"
required-features = ["datagen"]

[features]
# ---- perf study 58. Three arms LANDED UNCONDITIONALLY (`DirtyPiece::adds`'s
# range fact, the zipped index loops in `apply_dirty_directed`, and disjoint
# field borrows for both fold loops in `HalfkaContext::compute`) -- together
# -30.43 instructions/node and -9.88 branches/node, node-identical. Two arms
# were built and LOST and are recorded where they would be re-proposed, in the
# banner on `i8_deltas_into_generic`: study 37's paired row loop re-priced at
# `TILES = 8` (+16.96 i/n, twice its cost at `TILES = 2`) and a hand-hoisted
# unroll split (+63.35 i/n). A third, masking `DirtyPiece::add`'s write cursor,
# measured an exact null (+690 instructions in 2.93e10) and is not here.
# See docs/research/perf-study-58-*.md.
#
# `split58`: DIAGNOSTIC ONLY, never shipped. `#[inline(never)]` on every head
# and fold kernel wrapper, so a profile reports `forward_into`'s composition
# per SYMBOL rather than as one 11%-of-instructions blob. Per-symbol shares are
# the only attribution on this box that survives its own null -- study 36 §2.3
# killed per-mnemonic attribution of `instructions:u` with a 20x skew among
# four instructions that retire identically. Study 25 §1 ran this experiment
# once, three architectures ago; this feature is the re-runnable form of it.
split58 = []
# ---- perf study 55 RETAINED MEASUREMENT ARMS, RE-PRICED BY STUDY 56.
#
# Study 55 retained three arms as "large wins alone, blocked only by
# interaction", quoting -44.7 (`bcmisc55`) and -34.6 (`bcsort55`)
# instructions/node. Those figures were measured against `base55` -- a substrate
# that no longer exists, since study 55 then landed small-body inlining AND
# `BUF_MASK` on top of it. Study 56 re-measured all three against the SHIPPING
# binary and none of them survives:
#
#   arm         study 55 (vs base55)   study 56 (vs shipped)
#   bcmisc55         -44.7 i/n              +7.7 i/n   (rebuilt from 0ce956f4)
#   bcsort55         -34.6 i/n              +14.7 i/n
#   bccont55          +5.8 i/n              +55.6 i/n
#
# The interaction did not BLOCK those wins, it consumed them. `bcmisc55`'s
# useful half survived only after being respelled (`clamp` -> mask) and is now
# landed unconditionally in `Worker::reduction`; the other two are kept
# switchable purely as falsifications. See docs/research/perf-study-56-*.md §3.
#
# `bcsort55` (+14.7 i/n on the shipping tree): `partial_insertion_sort` reads
# `head[q - 1]` twice per shifted element, once in the loop condition and once
# in the body. NOT either rewrite study 23 rejected -- the permutation,
# including the observable BadQuiet tail, is untouched; only the load count
# changes. It still costs, alone (+14.7) and in combination (study 56 §5's
# `c_fin4` is 14.7 i/n worse than the same binary without it).
bcsort55 = []
# `bccont55` (+55.6 i/n on the shipping tree -- the study's largest single
# loser): `update_continuation_histories` has study 54's exact double-index
# shape on a RUNTIME-LENGTH slice, and converting it to one subslice + reversed
# zip did not pay. The shape being present is not sufficient. Study 55 measured
# it at +5.8; on the shipped tree it is ten times worse.
bccont55 = []
# ---- perf study 53 arms (do_move / bounds-check deletion). Node-identical by
# construction; each is a MEASUREMENT arm, promoted to unconditional if it wins.
# `cont53`: pad CONT_NB 3328 -> 4096 and mask, folding the continuation-history
# bounds check. Costs +1.125 MiB per WORKER THREAD and breaches design/09 §8's
# 21 MiB catalogue budget -- measured, but not free.
#
# PERF STUDY 56 re-measured it on the shipping tree: -5.1 i/n ALONE, but adding
# it to the study-56 landing set moves that set from -12.8 to -12.0 i/n, i.e. it
# is DOMINATED -- it buys nothing on top and still costs the 1.125 MiB. Its
# smaller sibling `cont_corr` (832 -> 1024, +288 KiB, inside the budget) DID
# land. Keep this arm switchable; do not ship it without a fresh measurement.
cont53 = []
# perf study 48 DIAGNOSTIC PROBE: drop the PSQ1 trailer at load so the whole
# psqt channel switches off. Changes the eval -- never ship it.
nopsqt48 = []
# SPSA tuning (D45): every params.rs scalar becomes a runtime-settable atomic
# behind `setoption name <NAME> value <x>`. OFF by default: the default build
# expands the same entries to inline-folded constants and stays bench-
# identical (D24). Tune builds are for the SPSA harness only, never shipped.
tune = []
# --- Perf study 54 ---
# `nogc54` (perf study 54 §3, the open question study 53 §6 item 2 left):
# study 53's `gc53` REVERTED, so its marginal cost/benefit can be
# read on the shipped tree. Study 53 landed `gc53 + magic53` together and
# reported that `magic53` alone was -22.3 loads/node (10/10) against the
# combination's -10.6 (7/10, ns) while instructions added to 0.1/node. This
# arm is the head-to-head that was missing. Node-identical.
nogc54 = []
# D47V deploy arch (768 accumulator, 32/32 head + skip). Mutually exclusive
# with the default 1280/128/32 consts; build D47V-capable binaries with
# `--features sota,arch-d47v`. Never combined into one binary — the CENN's
# dims must match the build (the loader validates section sizes).
arch-d47v = []
# D48W gen-2 arch (1536 accumulator, 16/32 head + skip). Same exclusivity
# rule: `--features sota,arch-d48w`, never combined with arch-d47v.
arch-d48w = []
# D48X: the W recipe at the A3 trunk's OWN width (1280 accumulator, 16/32 head
# + skip) — the arch the pre-launch NPS gate selected over 1536 (2026-07-27).
# Same exclusivity rule as the others.
arch-d48x = []
# HalfKA-only PROBE (arch-hka2048) — NOT a pinned decision, an unratified
# experiment. No FullThreats channel, 2048 accumulator, 32/32 head.
# The threat channel costs 1.78x engine speed at 1280 and 1.40x at 768
# (measured 2026-07-27), and removing it makes width 5.7x cheaper per unit —
# which is why this arch is WIDER than anything we have shipped. The net
# itself carries the no-threats flag, so the engine needs no runtime switch;
# this feature only sets the dimensions. Same exclusivity rule.
arch-hka2048 = []
# Distribution-only: embed net-0 as the default eval so the engine plays NNUE
# with no `EvalFile` set (for GUIs that can't set UCI string options). OFF by
# default, so runtime [dependencies] stays empty (D15) and the default build is
# PSQT/bench-neutral. Build a playable binary with `--features embed-net` plus
# ARCHON_EMBED_NET=<.cenn path relative to the crate root> in the build env;
# the net's width must match the build's nnue-l1-* feature.
embed-net = []
