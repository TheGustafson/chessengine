#
# `i8_deltas_into_inner` matched on four (adds, subs) pairs, chosen in study 25
# when the kernel was HalfKA-only and those four were a COMPLETE cover. Study 32
# routed the whole FullThreats channel through the same dispatch without
# revisiting the list. Counted for the first time in study 61
# (`foldcount::THR_PAIR`): 19.11% of threat folds are a SINGLE weight row and
# every one of them ran the runtime-length generic kernel.
#
# Landed unconditionally: the one-sided family (25.04% of threat folds) and the
# three-row family (16.09%), taking straight-line coverage 27.27% -> 68.40%.
# Measured together, 32 rounds, byte-identical null in the rotation:
# **-1.219% instructions and -2.274% branches per node, 32/32, se 0.000** --
# -68.9 i/n and -12.9 branches/n. Node-identical and eval-hash-identical.
