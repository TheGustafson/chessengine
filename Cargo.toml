# Measured on the promoted binary, 24 rounds, blocked Latin square, with both a
# byte-identical null and the `noshape62` revert in the rotation:
# **-2.024% instructions (-112.98/node) and -3.649% branches, 24/24 at
# se 0.000**, against a null of exactly -0.000%. Node-identical (5,001,562) and
# eval-hash exact. The cost is `.text` +5.16% and L1i misses +6.199% (0/24);
# `cycles:u` and two wall-clock panels were NOT resolvable on this box.
#
# The three rings are no longer separately switchable (study 61's precedent:
# one revert per study). `noshape62` restores study 61's dispatch at BOTH sites,
# so the contrast stays reproducible on the shipped tree; the per-ring ladder is
